<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="color-scheme" content="light dark">
<title>Private</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#F6F7F9;--card:#FFFFFF;--text:#0F1115;--muted:#5B6270;--faint:#8A91A0;--line:#E6E8EC;--accent:#2563EB;--accent-soft:#E8EFFE;--neg:#E5484D;
--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0B0D11;--card:#14171D;--text:#ECEEF2;--muted:#A0A7B4;--faint:#6F7684;--line:#232730;--accent:#6E9BFF;--accent-soft:#1A2440;--neg:#FF6B6F;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 22px 22px}
.lock{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:14.5px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;padding:13px 48px 13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.rem{display:flex;align-items:center;gap:10px;margin:16px 0 18px;font-size:14.5px;cursor:pointer;user-select:none}
.rem input{width:20px;height:20px;accent-color:var(--accent);margin:0}
button.go{width:100%;font:inherit;font-weight:650;font-size:16px;padding:14px;border-radius:13px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
button.go:disabled{opacity:.7;cursor:progress}
.err{min-height:20px;margin-top:12px;font-size:14px;color:var(--neg);text-align:center}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;display:none}
.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{margin-top:16px;font-size:12px;color:var(--faint);text-align:center}
</style>
</head>
<body>
<main>
<form class="card" id="f" autocomplete="on">
  <div class="lock"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
  <h1>Private dashboard</h1>
  <p>Enter the password to unlock. Everything is decrypted on this device.</p>
  <input type="text" name="username" value="owner" autocomplete="username" hidden>
  <label class="f" for="pw">Password</label>
  <div class="pw"><input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button class="eye" type="button" id="eye" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></button></div>
  <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
  <button class="go" id="go" type="submit"><span class="spin"></span><span id="gl">Unlock</span></button>
  <div class="err" id="err" role="alert" aria-live="polite"></div>
  <div class="foot">AES-256 encrypted · nothing is sent to a server</div>
</form>
</main>

const $=id=>document.getElementById(id);
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(P.salt),iterations:P.iter},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  let s; try{s=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  if(!s||s.salt!==P.salt) {if(s)localStorage.removeItem(KEY); return;}
  try{const k=await crypto.subtle.importKey("raw",u8(s.k),{name:"AES-GCM"},false,["decrypt"]); await open(k);}
  catch(e){localStorage.removeItem(KEY);}
}
$("eye").onclick=()=>{const i=$("pw");i.type=i.type==="password"?"text":"password";};
$("f").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=$("pw").value; if(!pw) return;
  $("go").disabled=true; $("go").classList.add("busy"); $("gl").textContent="Unlocking…"; $("err").textContent="";
  try{
    const key=await derive(pw);
    const raw=await crypto.subtle.exportKey("raw",key);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct)); // throws if wrong
    if($("rem").checked) localStorage.setItem(KEY,JSON.stringify({salt:P.salt,k:b64(raw)}));
    const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
  }catch(err){
    $("go").disabled=false; $("go").classList.remove("busy"); $("gl").textContent="Unlock";
    $("err").textContent="Wrong password. Try again."; const c=$("f"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    $("pw").select();
  }
});
if(!P){$("err").textContent="Nothing to unlock.";$("go").disabled=true;}
else tryRemembered();
})();
</script>
